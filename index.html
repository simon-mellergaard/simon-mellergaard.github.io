<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simon Mellergaard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #24292e;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    header h1 { font-size: 1.25rem; }
    nav a {
      color: #ccc;
      text-decoration: none;
      margin-right: 1.25rem;
      font-size: 0.95rem;
    }
    nav a:hover, nav a.active { color: #fff; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
    }
    h2 { font-size: 2.5rem; margin-bottom: 1rem; }
    p { font-size: 1.1rem; color: #555; max-width: 500px; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 1.75rem;
      background: #0366d6;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
    }
    .btn:hover { background: #0256b9; }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>Simon Mellergaard</h1>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="about.html">About</a>
    </nav>
  </header>
  <main>
    <h2>Welcome 👋</h2>
    <p>This is such a great website, yay. Explore the pages to learn more.</p>
    <a href="about.html" class="btn">About me →</a>
  </main>
  <footer>© 2026 Simon Mellergaard</footer>
</body>
</html>
